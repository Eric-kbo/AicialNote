name: Feature request / 功能建议
description: Suggest an idea or an improvement. 提出新功能或改进。
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do? / 你想解决什么问题？
      description: Describe the situation first, then the solution you have in mind.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed solution / 你设想的方案
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives / 其他方案
      description: Workarounds you use today, or other tools that do this well.
